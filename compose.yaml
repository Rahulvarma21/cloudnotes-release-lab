services:
  cloudnotes-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudnotes-api:0.1.0
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"

  # Local, ₹0 artifact registry for pushing/pulling images without a paid
  # registry account. Not required to grade the build itself.
  registry:
    image: registry:2
    ports:
      - "5050:5000"  # host 5000 often taken (e.g. macOS AirPlay Receiver)
    volumes:
      - ./artifacts:/var/lib/registry
